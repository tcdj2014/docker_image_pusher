name: Docker Python Pull and Push 

on:
    workflow_dispatch:
    push:
        branches: [ main ]
        paths:
            - 'images.txt'
            - '.github/workflows/docker.yaml'
            - 'script/requirements.txt'
            - 'script/readimages.py'
    schedule:
        -   cron: '00 4 * * *'


env:
    ALIYUN_REGISTRY: "${{ vars.ALIYUN_REGISTRY }}"
    ALIYUN_NAME_SPACE: "${{ vars.ALIYUN_NAME_SPACE }}"
    ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
    ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

    build:
        name: Pull
        runs-on: ubuntu-latest
        steps:
            -   name: Before freeing up disk space
                run: |
                    echo "Before freeing up disk space"
                    echo "=============================================================================="
                    df -hT
                    echo "=============================================================================="

            # 增加可用磁盘空间：只删除用不到的组件，不缩小根分区
            # 注意：不要再用 maximize-build-space 把大卷挂到 /var/lib/docker 并把根分区压到 2G。
            # 新版 ubuntu-latest 的 Docker 使用 containerd 镜像存储，镜像层解压在
            # /var/lib/containerd（位于根分区），根分区太小会导致
            # "ERROR: failed to extract layer ... no space left on device"
            -   name: Free up disk space
                run: |
                    sudo rm -rf /usr/share/dotnet \
                                /usr/local/lib/android \
                                /opt/ghc \
                                /opt/hostedtoolcache/CodeQL \
                                /usr/local/share/boost
                    sudo docker system prune -af --volumes || true

            -   name: Free up disk space complete
                run: |
                    echo "Free up disk space complete"
                    echo "=============================================================================="
                    df -hT
                    echo "=============================================================================="

            -   name: Checkout Code
                uses: actions/checkout@v4

            # 安装指定版本的 Python
            -   name: Set up Python
                uses: actions/setup-python@v4
                with:
                  python-version: "3.12"  # 支持 3.x、3.8.6 等精确版本
                  # cache: 'pip'            # 禁用pip缓存，因为我们没有第三方依赖

            # 验证Python安装
            -   name: Check Python version
                run: |
                  python --version
                  pip --version

            # 本流程只做 pull / tag / push，不需要 buildx；
            # 若后续要 docker buildx build 再多平台构建，再加回 docker/setup-buildx-action@v3
            # -   name: Docker Setup Buildx
            #     uses: docker/setup-buildx-action@v3

            -   name: Login to DockerHub
                uses: docker/login-action@v3
                with:
                    registry: ${{ vars.ALIYUN_REGISTRY }}
                    username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                    password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            -   name: Build and push image Aliyun
                run: |
                    # 本项目仅使用Python标准库，无第三方依赖
                    # 如需添加依赖，请在此处列出
                    # python -m pip install -r script/requirements.txt
                    python script/readimages.py
